# CI del M1 (Definition of Done: PRs, ruff, GitHub Actions). Compuertas: lint → pruebas → Docker.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen --group dev
      - name: Ruff (lint)
        run: uv run ruff check . --output-format=github
      - name: Ruff (formato)
        run: uv run ruff format --check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --frozen --all-groups
      - name: Caché del modelo (118 MB)
        uses: actions/cache@v4
        with:
          path: artifacts/model/conv_MLP_84.h5
          key: model-conv_MLP_84-d9548ff6
      - name: Descargar modelo (verifica SHA-256)
        run: uv run python scripts/fetch_model.py
      - name: Pruebas + cobertura (compuerta 80 %)
        run: uv run pytest -v --cov --cov-report=xml --cov-fail-under=80
      - name: Smoke test del curso
        run: uv run python smoke_infer.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with: {name: coverage, path: coverage.xml}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Liberar espacio en disco
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Build imagen CPU
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: neumonia:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test del contenedor (POST /predict)
        run: |
          docker run -d --name api -p 8000:8000 neumonia:ci
          uv run --no-project --with httpx python scripts/container_smoke.py http://localhost:8000
      - if: failure()
        run: docker logs api
