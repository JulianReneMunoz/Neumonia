openapi: 3.0.3
info:
  title: Neumonía — Inference API
  version: 0.7.0
  description: |
    Contrato de inferencia del caso Neumonía (Keras/TF + Grad-CAM).
    Las claves `label`, `probability` y `gradcam_url` son el contrato mínimo del curso y no cambian
    aunque cambie el modelo; las demás son aditivas (compatibilidad hacia atrás).
    Uso académico: no es un dispositivo médico.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      summary: Estado del servicio (healthcheck de Docker y del despliegue)
      responses:
        '200':
          description: Servicio vivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /predict:
    post:
      summary: Clasifica una radiografía de tórax y genera su mapa Grad-CAM
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: DICOM (.dcm), JPG o PNG. Máximo 20 MB.
      responses:
        '200':
          description: Resultado de la inferencia
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
              example:
                label: PNEUMONIA
                probability: 0.9921
                gradcam_url: /static/gradcam/3f2b9c0e8a.png
                subtype: viral
                class_probabilities: {bacteriana: 0.1039, normal: 0.0079, viral: 0.8882}
                metadata: {age: 6, sex: F, view_position: AP, modality: CR}
                model_version: conv_MLP_84@modelo-v1
                request_id: 3f2b9c0e8a
                findings:
                  zone_attention: {derecho_superior: 0.217, derecho_medio: 0.091, derecho_inferior: 0.149, izquierdo_superior: 0.185, izquierdo_medio: 0.097, izquierdo_inferior: 0.221}
                  dominant_zone: izquierdo_inferior
                  laterality: bilateral
                  extent_pct: 4.0
                  out_of_lung_pct: 42.0
                  outside_inside_ratio: 1.04
                  shortcut_warning: true
                  attention_grid: [[0.0, 0.1], [0.2, 0.3]]
                  summary: ["El modelo sugiere hallazgos compatibles con neumonía de probable patrón viral (probabilidad 99.2%)."]
                  lung_source: geometrica
                  lung_note: "Segmentación pspnet descartada: un pulmón ocupa solo el 2 % de la imagen (...). Se usan zonas geométricas."
                  lung_grid: [[0, 0], [1, 2]]
        '422':
          description: Entrada inválida (vacía, corrupta, formato no soportado o demasiado grande)
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: array
                    items:
                      type: object
                      properties:
                        loc: {type: array, items: {type: string}}
                        msg: {type: string}
        '500':
          description: Error del modelo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /static/gradcam/{id}.png:
    get:
      summary: Imagen PNG con el mapa Grad-CAM superpuesto (512×512)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: PNG
          content:
            image/png: {}
components:
  schemas:
    Health:
      type: object
      required: [status, model_loaded, model_version]
      properties:
        status: {type: string, enum: [ok]}
        model_loaded: {type: boolean}
        model_version: {type: string}
    Prediction:
      type: object
      required: [label, probability, gradcam_url, subtype, class_probabilities, model_version, request_id]
      properties:
        label: {type: string, enum: [NORMAL, PNEUMONIA]}
        probability: {type: number, minimum: 0, maximum: 1, description: Probabilidad de la etiqueta devuelta}
        gradcam_url: {type: string, nullable: true}
        subtype: {type: string, enum: [bacteriana, normal, viral]}
        class_probabilities:
          type: object
          additionalProperties: {type: number}
        metadata:
          type: object
          description: Metadatos DICOM no identificables (edad, sexo, proyección, modalidad...)
          additionalProperties: true
        model_version: {type: string}
        request_id: {type: string}
        findings:
          $ref: '#/components/schemas/Findings'
    Findings:
      type: object
      nullable: true
      description: >-
        Informe de hallazgos asistido (ADR-0007). Describe dónde se fijó el modelo (Grad-CAM) por zonas
        pulmonares aproximadas; no es una segmentación de lesiones. null si no se calculó Grad-CAM.
      required: [zone_attention, dominant_zone, laterality, extent_pct, out_of_lung_pct, outside_inside_ratio, shortcut_warning, attention_grid, summary]
      properties:
        zone_attention:
          type: object
          description: Atención media [0, 1] por zona; derecho = pulmón derecho del paciente (izquierda de la imagen)
          additionalProperties: {type: number}
        dominant_zone: {type: string, description: "Zona con mayor atención; vacío si no hay atención"}
        laterality: {type: string, enum: [derecho, izquierdo, bilateral, sin_foco]}
        extent_pct: {type: number, description: "% del campo pulmonar con atención >= 0.5"}
        out_of_lung_pct: {type: number, description: "% de la atención total fuera de los campos pulmonares"}
        outside_inside_ratio: {type: number, description: "Densidad de atención fuera/dentro (1.0 = uniforme; tope 99)"}
        shortcut_warning: {type: boolean, description: "true si outside_inside_ratio >= 1.0 (posible atajo)"}
        attention_grid:
          type: array
          description: Mapa Grad-CAM normalizado 31×31 para la vista 3D
          items: {type: array, items: {type: number}}
        summary:
          type: array
          items: {type: string}
          description: Frases del informe en español, con la nota de limitación al final
        lung_source:
          type: string
          enum: [geometrica, pspnet]
          description: "Origen de las zonas: rectángulos aproximados o silueta segmentada (ADR-0008)"
        lung_note: {type: string, description: "Motivo del respaldo geométrico; vacío si no hubo"}
        lung_grid:
          type: array
          description: "Máscara 64×64: 0 fuera, 1 pulmón derecho del paciente, 2 pulmón izquierdo"
          items: {type: array, items: {type: integer, enum: [0, 1, 2]}}
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
