# Arquitectura local/producción: UI (Streamlit) → API (FastAPI) ; MLflow para experimentos.
#   docker compose up -d --build   →  UI http://localhost:8501 · API http://localhost:8000/docs · MLflow http://localhost:5000
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ${REGISTRY_IMAGE:-neumonia}:${IMAGE_TAG:-latest}
    ports: ["8000:8000"]
    environment:
      NEUMONIA_THRESHOLD: ${NEUMONIA_THRESHOLD:-0.5}
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2", memory: 3g}

  ui:
    image: ${REGISTRY_IMAGE:-neumonia}:${IMAGE_TAG:-latest}
    command: ["streamlit", "run", "src/neumonia/view/streamlit_app.py",
              "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports: ["8501:8501"]
    environment:
      NEUMONIA_API_URL: http://api:8000   # Estrategia HttpGateway: la UI no carga el modelo
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
              "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
              "--artifacts-destination", "/mlflow/artifacts"]
    ports: ["5000:5000"]
    volumes: ["mlflow-data:/mlflow"]
    profiles: ["mlops"]   # docker compose --profile mlops up -d

volumes:
  mlflow-data:
