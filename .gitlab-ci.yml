# CI/CD del M4 (GitLab): compuertas de calidad → imagen → despliegue en Droplet.
# Variables (Settings → CI/CD → Variables, marcadas "Protected" y "Masked"):
#   DROPLET_HOST, DROPLET_USER, SSH_PRIVATE_KEY (tipo File), SSH_KNOWN_HOSTS
# CI_REGISTRY_* las provee GitLab automáticamente.
stages: [lint, test, build, scan, deploy, verify]

variables:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

default:
  image: ghcr.io/astral-sh/uv:0.11-python3.13-bookworm-slim
  cache:
    key: {files: [uv.lock]}
    paths: [.uv-cache]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_TAG

# ---------- Compuerta 1: estilo ----------
ruff:
  stage: lint
  script:
    - uv sync --frozen --group dev
    - uv run ruff check . --output-format=gitlab > gl-code-quality-report.json || (cat gl-code-quality-report.json; exit 1)
    - uv run ruff format --check .
  artifacts:
    when: always
    reports: {codequality: gl-code-quality-report.json}

# ---------- Compuerta 2: pruebas + cobertura >= 80 % ----------
pytest:
  stage: test
  cache:
    - key: {files: [uv.lock]}
      paths: [.uv-cache]
    - key: model-d9548ff6
      paths: [artifacts/model/]
  script:
    - uv sync --frozen --all-groups
    - uv run python scripts/fetch_model.py
    - uv run pytest -v --cov --cov-report=xml --cov-report=term --junitxml=report.xml --cov-fail-under=80
    - uv run python smoke_infer.py
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report: {coverage_format: cobertura, path: coverage.xml}

# ---------- Imagen ----------
docker-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_TAG
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -f docker/Dockerfile -t "$IMAGE" .
    - docker run -d --name api -p 8000:8000 "$IMAGE"
    - apk add --no-cache python3 py3-httpx
    - python3 scripts/container_smoke.py http://docker:8000
    - docker push "$IMAGE"

# ---------- Compuerta 3: vulnerabilidades de la imagen ----------
trivy:
  stage: scan
  image: {name: aquasec/trivy:latest, entrypoint: [""]}
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_TAG
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE"

# ---------- Despliegue en Droplet (solo main, aprobación manual) ----------
deploy-droplet:
  stage: deploy
  image: alpine:3.20
  environment: {name: production, url: "http://$DROPLET_HOST:8501"}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - scp docker-compose.yml "$DROPLET_USER@$DROPLET_HOST:~/neumonia/docker-compose.yml"
    - >
      ssh "$DROPLET_USER@$DROPLET_HOST"
      "cd ~/neumonia &&
       echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
       export REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG='$CI_COMMIT_SHORT_SHA' &&
       docker compose pull api && docker compose up -d --no-build && docker image prune -f"

# ---------- Verificación post-despliegue ----------
smoke-production:
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
  needs: [deploy-droplet]
  script:
    - uv run --no-project --with httpx python scripts/container_smoke.py "http://$DROPLET_HOST:8000"
